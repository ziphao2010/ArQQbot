name: Bug 报告
description: 报告可复现的功能异常或崩溃
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全问题请不要在这里提交，按 SECURITY.md 私下报告。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际行为与预期行为是什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 创建实例 ...
        2. 启用插件 ...
        3. 触发 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ArQQbot 版本
      description: 应用版本或提交 hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本、实例环境（沙箱/正式）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请先移除 AppSecret、token、用户隐私等信息
      render: text
    validations:
      required: false
