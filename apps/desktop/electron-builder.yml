appId: com.arqqbot.desktop
productName: ArQQBot
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/node_modules/**"
extraResources:
  - from: ../../packages/plugin-echo/package.json
    to: plugins/plugin-echo/package.json
  - from: ../../packages/plugin-echo/dist
    to: plugins/plugin-echo/dist
  - from: ../../packages/runtime/dist/worker-entry.cjs
    to: worker/worker-entry.cjs
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  executableName: arqqbot
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: ArQQBot contributors <ziphao2010@users.noreply.github.com>
